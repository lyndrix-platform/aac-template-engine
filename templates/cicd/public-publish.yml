# ==========================================================================
# DEPRECATED - replaced by templates/cicd/public-release.yml
# ==========================================================================
# This file used to publish v-tagged releases (vX.Y.Z, PUBLISH_TOKEN, pilot: aac-pairdrop).
# There is now exactly ONE way to publish: public-release.yml, which service-pipeline.yml
# already includes for every AaC repo (tag X.Y.Z without "v", token APP_AS_CODE_GITHUB_TOKEN,
# orphan branch `public`, standalone docker compose, gitleaks + grep gates).
#
# Migration (e.g. aac-pairdrop):
#   1. Remove the `include:` of public-publish.yml from the repo's .gitlab-ci.yml.
#   2. Release with a tag X.Y.Z (no "v"); GitHub receives X.Y.Z and vX.Y.Z.
#   3. The existing GitHub repo has unrelated history: run the first release with
#      PUBLIC_FORCE_PUSH=true once (then remove the variable).
#   4. PUBLISH_TOKEN is no longer used and can be deleted.
# Including this file is harmless: it defines no jobs any more.
variables:
  PUBLIC_PUBLISH_DEPRECATED: "true"
