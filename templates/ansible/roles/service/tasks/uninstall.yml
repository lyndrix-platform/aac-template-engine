---
# Default no-op uninstall. A service provides its real teardown steps
# (stop/disable services, remove packages, purge config/data, deregister, …) by
# overriding this file at:
#   custom_templates/ansible/roles/service/tasks/uninstall.yml

- name: "{{ final_ssot_vars.service.name }} | No service-specific uninstall tasks defined"
  ansible.builtin.debug:
    msg: >-
      No uninstall tasks provided for {{ final_ssot_vars.service.name }}. Override
      custom_templates/ansible/roles/service/tasks/uninstall.yml in the service repo.
