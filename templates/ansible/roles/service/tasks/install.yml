---
# Default no-op install. A service provides its real installation steps
# (repos, packages, users, config, systemd, DB init, agent registration, …) by
# overriding this file at:
#   custom_templates/ansible/roles/service/tasks/install.yml
#
# Keep secrets OUT of generated files: reference them as Ansible runtime vars
# (e.g. vars/secrets from the SSoT context), never hard-code them here.

- name: "{{ service.name }} | No service-specific install tasks defined"
  ansible.builtin.debug:
    msg: >-
      No install tasks provided for {{ service.name }}. Override
      custom_templates/ansible/roles/service/tasks/install.yml in the service repo.
